[project]
name = "solar-open2-lab"
version = "0.1.0"
description = "A 24/7 Solar (solar-open2) self-improving loop against the real EdgeBench dabic judge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.99",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "numpy>=2.0",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solar", "edgelab"]
