[project]
name = "solar-cookbook"
version = "0.1.0"
description = "Fun agent examples & recipes for Upstage Solar (solar-open2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.99",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solar"]
